<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found – Krum Panchev</title><meta name="robots" content="noindex"><style>
:root{--bg:#F4F6F9;--card:#fff;--navy:#1F3A5F;--ink:#0F1C2E;--text:#3A4656;--muted:#5B6B80;--line:#E2E8F0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}a:focus-visible,.btn:focus-visible{outline:3px solid #7AA7E0;outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:0;z-index:10;background:rgba(244,246,249,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;align-items:center}
nav a{color:var(--text);text-decoration:none;font-size:15px}nav a:hover{color:var(--navy)}
.lang{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600;font-size:13px;color:var(--navy)}
.hero{padding:72px 0 48px;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;border-top:0}
.photo{width:148px;height:148px;border-radius:50%;object-fit:cover;background:var(--navy);display:block;box-shadow:0 8px 30px rgba(15,28,46,.15)}
h1{font-size:46px;line-height:1.1;margin:0 0 6px;color:var(--ink);letter-spacing:-.025em}
.role{font-size:22px;font-weight:600;color:var(--navy);margin:0 0 10px}
.tag{margin:0 0 4px;font-size:18px}.loc{margin:0 0 24px;color:var(--muted);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:15px;border:1.5px solid var(--navy)}
.btn:hover{background:#17304f}.btn.ghost{background:transparent;color:var(--navy)}.btn.ghost:hover{background:#e8eef6}
section{padding:44px 0;border-top:1px solid var(--line)}
h2{font-size:28px;color:var(--ink);margin:0 0 20px;letter-spacing:-.015em}
h3{font-size:18px;color:var(--ink);margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-size:28px;color:var(--navy);letter-spacing:-.02em}.stat span{font-size:14px;color:var(--muted);line-height:1.45;display:block}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card p{margin:0;font-size:16px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 28px;list-style:none;padding:0;margin:0}
.how li{padding-left:18px;border-left:3px solid var(--navy)}.how p{margin:0;font-size:16px}
.tl{list-style:none;margin:0 0 8px;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 22px 24px}
.tl li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 4px var(--bg)}
.tl .when{font-size:14px;color:var(--muted);font-weight:600}.tl .what{color:var(--ink);font-weight:600}
.note{color:var(--muted);font-size:15px;margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.tags li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
footer{padding:32px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}footer a{color:var(--muted)}
@media (max-width:760px){
 body{font-size:16px}nav ul li:not(:last-child){display:none}
 .hero{grid-template-columns:1fr;padding-top:40px;gap:20px}.photo{width:112px;height:112px}
 h1{font-size:36px}.role{font-size:19px}.stats{grid-template-columns:1fr 1fr}.cards,.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><main class="wrap" style="padding:80px 24px"><h1>Page not found</h1><p><a href="/">Go to Krum Panchev's homepage</a></p></main></body></html>
